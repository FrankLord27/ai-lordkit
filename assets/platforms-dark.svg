@keyframes shine{0%,60%{transform:translateX(0) skewX(-20deg)}100%{transform:translateX(330px) skewX(-20deg)}}
@keyframes ok{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
@media (prefers-reduced-motion:reduce){.float,.shine,.ok{animation:none}}
