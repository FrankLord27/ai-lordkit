<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="ai-lordkit features"><defs><linearGradient id="i0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1"/></linearGradient><linearGradient id="i1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="i2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></linearGradient><linearGradient id="i3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ea580c"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.08"/></filter></defs><g transform="translate(10 10)" filter="url(#sh)"><rect width="620" height="176" rx="20" fill="#ffffff" stroke="#e2e8f0"/><clipPath id="c0"><rect width="620" height="176" rx="20"/></clipPath><rect width="620" height="6" fill="url(#i0)" clip-path="url(#c0)"/><g transform="translate(30 34)"><rect width="56" height="56" rx="16" fill="url(#i0)"/><g transform="translate(5 6)"><rect x="8" y="22" width="14" height="14" rx="3" fill="#fff"/><rect x="25" y="22" width="14" height="14" rx="3" fill="#fff" fill-opacity="0.75"/><rect x="16" y="6" width="14" height="14" rx="3" fill="#fff" fill-opacity="0.9"/></g></g><text x="110" y="64" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f172a">Block method + block map</text><text x="110" y="102" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#475569">Build one user flow at a time: UI, data and API,</text><text x="110" y="128" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#475569">with scenarios, tests and a security audit per block.</text></g><g transform="translate(650 10)" filter="url(#sh)"><rect width="620" height="176" rx="20" fill="#ffffff" stroke="#e2e8f0"/><clipPath id="c1"><rect width="620" height="176" rx="20"/></clipPath><rect width="620" height="6" fill="url(#i1)" clip-path="url(#c1)"/><g transform="translate(30 34)"><rect width="56" height="56" rx="16" fill="url(#i1)"/><g transform="translate(5 6)"><path d="M23 6 L40 14 L23 22 L6 14 Z" fill="#fff"/><path d="M6 21 L23 29 L40 21" fill="none" stroke="#fff" stroke-width="3" stroke-opacity="0.85" stroke-linejoin="round"/><path d="M6 28 L23 36 L40 28" fill="none" stroke="#fff" stroke-width="3" stroke-opacity="0.65" stroke-linejoin="round"/></g></g><text x="110" y="64" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f172a">Public / private layers</text><text x="110" y="102" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#475569">A generic public kit with your private repo on top.</text><text x="110" y="128" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#475569">A leak scanner stops tokens and client names.</text></g><g transform="translate(10 206)" filter="url(#sh)"><rect width="620" height="176" rx="20" fill="#ffffff" stroke="#e2e8f0"/><clipPath id="c2"><rect width="620" height="176" rx="20"/></clipPath><rect width="620" height="6" fill="url(#i2)" clip-path="url(#c2)"/><g transform="translate(30 34)"><rect width="56" height="56" rx="16" fill="url(#i2)"/><g transform="translate(5 6)"><circle cx="23" cy="22" r="15" fill="none" stroke="#fff" stroke-width="3"/><ellipse cx="23" cy="22" rx="6.5" ry="15" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M8 22 H38" stroke="#fff" stroke-width="2.5"/></g></g><text x="110" y="64" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f172a">Spanish-first, LatAm stack</text><text x="110" y="102" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#475569">NestJS · Next.js · Prisma · PostgreSQL · Redis,</text><text x="110" y="128" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#475569">with multi-tenant, ERP/POS and DGII invoicing rules.</text></g><g transform="translate(650 206)" filter="url(#sh)"><rect width="620" height="176" rx="20" fill="#ffffff" stroke="#e2e8f0"/><clipPath id="c3"><rect width="620" height="176" rx="20"/></clipPath><rect width="620" height="6" fill="url(#i3)" clip-path="url(#c3)"/><g transform="translate(30 34)"><rect width="56" height="56" rx="16" fill="url(#i3)"/><g transform="translate(5 6)"><path d="M23 5 L38 11 V22 C38 31 31.5 37 23 40 C14.5 37 8 31 8 22 V11 Z" fill="#fff"/><path d="M16 22 L21 27 L30 17" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/></g></g><text x="110" y="64" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#0f172a">Security at three moments</text><text x="110" y="102" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#475569">Before a command (guard.sh), before a package</text><text x="110" y="128" font-family="'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#475569">(supply-guard.sh) and when a block closes (/blindar).</text></g></svg>