name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests del hook guard.sh
        run: ./hooks/test-guard.sh
      - name: Tests de mem-search
        run: ./tests/mem-search/test.sh
      - name: Escáner de datos sensibles
        run: ./scripts/scan-leaks.sh
      - name: settings.json y mcp/servers.json son JSON válido
        run: jq empty settings.json mcp/servers.json private-template/*.json
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Motor de mapa-bloque
        run: pnpm install --frozen-lockfile --prod --ignore-scripts --dir skills/mapa-bloque/scripts
      - name: Test de mapa-bloque
        run: ./tests/mapa-bloque/test.sh
