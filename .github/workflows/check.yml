name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests del hook guard.sh
        run: ./hooks/test-guard.sh
      - name: Tests de mem-search
        run: ./tests/mem-search/test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tests de brechas y supply-guard (con fixtures y contra OSV, KEV, EPSS y deps.dev reales)
        run: ./tests/brechas/test.sh
        env:
          BRECHAS_RED: "1"
      - name: Escáner de datos sensibles
        run: ./scripts/scan-leaks.sh
      - name: settings.json, mcp/servers.json y el marketplace son JSON válido
        run: jq empty settings.json mcp/servers.json .claude-plugin/marketplace.json private-template/*.json
      - name: ShellCheck (errores)
        run: |
          shellcheck -S error get.sh install.sh hooks/*.sh bin/claude-kimi bin/shell-init.sh \
            scripts/*.sh skills/mem-search/scripts/mem-search.sh tests/mem-search/test.sh tests/modos/test.sh \
            tests/brechas/test.sh
      - name: zsh para probar el launcher como en macOS
        run: sudo apt-get install -y zsh
      - name: Modos (claude --modo) y statusline
        run: ./tests/modos/test.sh
      - name: update conserva tus ajustes, rollback y uninstall
        run: ./tests/install/test.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Motor de mapa-bloque
        run: pnpm install --frozen-lockfile --prod --ignore-scripts --dir skills/mapa-bloque/scripts
      - name: Test de mapa-bloque
        run: ./tests/mapa-bloque/test.sh
