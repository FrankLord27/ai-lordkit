name: install

# Prueba el instalador de un solo comando (get.sh) en Linux y macOS, como lo correría
# un usuario: script por pipe a bash, sin terminal y sin clonar el repo.
on:
  pull_request:
    paths:
      - get.sh
      - install.sh
      - settings.json
      - hooks/**
      - scripts/**
      - .github/workflows/install.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # El commit que se está probando (en un PR, la cabeza de la rama).
      AI_LORDKIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sintaxis con el bash del sistema (3.2 en macOS)
        run: /bin/bash -n get.sh && /bin/bash -n install.sh && /bin/bash -n hooks/guard.sh

      - name: Tests del hook guard.sh
        run: ./hooks/test-guard.sh

      - name: Instalación limpia (curl | bash, sin terminal)
        run: cat get.sh | bash

      - name: Comprueba la instalación
        run: |
          set -euo pipefail
          test -f ~/.ai-lordkit/install.sh
          test "$(cat ~/.ai-lordkit/.ai-lordkit-ref)" = "$AI_LORDKIT_REF"
          test -x ~/.claude/hooks/guard.sh
          jq empty ~/.claude/settings.json
          n=$(ls ~/.claude/agents/*.md | wc -l); test "$n" -ge 9
          ~/.local/bin/claude --version
          node --version
          # Los plugins del marketplace oficial quedaron instalados y activos.
          # (Los de `ai-lordkit` salen de main, así que en un PR que los agrega todavía no existen.)
          want=$(jq -r '.enabledPlugins | to_entries[] | select(.value) | .key | select(endswith("@claude-plugins-official"))' settings.json)
          have=$(~/.local/bin/claude plugin list --json | jq -r '.[] | select(.enabled) | .id')
          for id in $want; do grep -qx "$id" <<<"$have" || { echo "falta el plugin $id"; exit 1; }; done

      - name: Segunda corrida (idempotente, toma el camino update)
        run: |
          set -euo pipefail
          cat get.sh | bash
          test -d ~/.ai-lordkit.prev
          test -x ~/.claude/hooks/guard.sh

      - name: Versión inexistente falla sin romper lo instalado
        run: |
          if cat get.sh | AI_LORDKIT_REF=no-existe-esta-version bash; then
            echo "debió fallar"; exit 1
          fi
          test -f ~/.ai-lordkit/install.sh
